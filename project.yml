name: Speak
options:
  bundleIdPrefix: com.ritvikbansal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0

settings:
  base:
    DEVELOPMENT_TEAM: SFHFA7X45W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Speak:
    type: application
    platform: iOS
    sources:
      - path: Speak
        type: syncedFolder
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ritvikbansal.speak
        PRODUCT_NAME: Speak
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Off the Cuff"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSCameraUsageDescription: "Off the Cuff records video of you speaking so you can watch your delivery back."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Off the Cuff records your voice to transcribe your speech and count filler words."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Off the Cuff uses on-device speech recognition as a backup when the verbatim speech model is not downloaded."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  SpeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeakTests
        type: syncedFolder
    dependencies:
      - target: Speak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ritvikbansal.speak.tests

schemes:
  Speak:
    build:
      targets:
        Speak: all
        SpeakTests: [test]
    test:
      targets:
        - SpeakTests
    archive:
      config: Release
